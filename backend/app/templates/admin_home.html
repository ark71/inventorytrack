{% extends "base.html" %}
{% block title %}InventoryTrack - Admin{% endblock %}

{% block content %}
<div class="page">

  <div class="admin-header">
    <h1>Admin</h1>

    <div class="health-pill" title="Checks /healthz">
      <div id="healthIndicator" class="health-dot"></div>
      <div id="healthLabel" class="health-label">Checking…</div>

      <div class="health-actions">
        <button type="button" onclick="checkHealth()">Check</button>
        <a class="navlink" href="/healthz" target="_blank" style="padding:6px 10px; border-radius:999px;">JSON</a>
      </div>
    </div>
  </div>

  <p class="small">System tools &amp; maintenance</p>

  <div class="row">
    {% for t in tools %}
      <div class="card" style="flex:1; min-width:320px;">
        <div style="display:flex; justify-content:space-between; gap:12px;">
          <div>
            <div style="font-weight:700; font-size:18px;">{{ t.name }}</div>
            <div class="small" style="margin-top:6px;">{{ t.desc }}</div>
          </div>

          {% if t.method == "POST" %}
            <form method="post" action="{{ t.href }}">
              <button type="submit">Run</button>
            </form>
          {% else %}
            <a class="navlink" href="{{ t.href }}"
               {% if t.href.startswith('/docs') %}
               target="_blank"
               {% endif %}
            >Open</a>
          {% endif %}
        </div>
      </div>
    {% endfor %}
  </div>
</div>

<script>
async function checkHealth() {
  const dot = document.getElementById("healthIndicator");
  const label = document.getElementById("healthLabel");

  dot.classList.remove("ok", "bad");
  label.textContent = "Checking…";

  try {
    const res = await fetch("/healthz", { cache: "no-store" });
    const data = await res.json();

    if (data && data.ok === true) {
      dot.classList.add("ok");
      label.textContent = "Healthy";
    } else {
      dot.classList.add("bad");
      label.textContent = "Unhealthy";
    }
  } catch (e) {
    dot.classList.add("bad");
    label.textContent = "Down";
  }
}

document.addEventListener("DOMContentLoaded", checkHealth);
</script>

{% endblock %}
