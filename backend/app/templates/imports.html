{% extends "base.html" %}
{% block title %}InventoryTrack - Imports{% endblock %}

{% block content %}
<div class="page">
  <div style="display:flex; gap: 12px; align-items: baseline; flex-wrap: wrap;">
    <h1 style="margin:0;">Imports</h1>
    <div class="small">Upload exports to update your database.</div>
  </div>

  <div class="row" style="margin-top: 14px;">
    <div class="card" style="flex:1; min-width: 360px;">
      <div style="display:flex; align-items: baseline; gap: 10px; flex-wrap: wrap;">
        <h2 style="margin:0;">ShopGoodwill XLSX</h2>
        <div class="small">Allocates costs and rebuilds inventory</div>
      </div>

      <form id="goodwillForm" style="margin-top: 10px;">
        <input type="file" name="file" accept=".xlsx" required />
        <div style="margin-top:10px; display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
          <button type="submit">Import</button>
          <span class="small" id="goodwillStatus"></span>
        </div>
      </form>

      <h3 style="margin-bottom:8px;">Result</h3>
      <pre id="goodwillResult">{}</pre>
    </div>

    <div class="card" style="flex:1; min-width: 360px;">
      <div style="display:flex; align-items: baseline; gap: 10px; flex-wrap: wrap;">
        <h2 style="margin:0;">eBay Sold CSV</h2>
        <div class="small">Imports orders and fees</div>
      </div>

      <form id="ebayForm" style="margin-top: 10px;">
        <input type="file" name="file" accept=".csv,text/csv" required />
        <div style="margin-top:10px; display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
          <button type="submit">Import</button>
          <span class="small" id="ebayStatus"></span>
        </div>
      </form>

      <h3 style="margin-bottom:8px;">Result</h3>
      <pre id="ebayResult">{}</pre>
    </div>
  </div>

  <script>
    async function postFile(url, formEl, outEl, statusEl) {
      const fd = new FormData(formEl);
      if (statusEl) statusEl.textContent = "Uploading...";
      outEl.textContent = "Uploading...";

      const res = await fetch(url, { method: "POST", body: fd });
      const txt = await res.text();

      try {
        const parsed = JSON.parse(txt);
        outEl.textContent = JSON.stringify(parsed, null, 2);
        if (statusEl) statusEl.textContent = parsed.ok ? "Done." : (parsed.error || "Failed.");
      } catch {
        outEl.textContent = txt;
        if (statusEl) statusEl.textContent = res.ok ? "Done." : "Failed.";
      }
    }

    document.getElementById("goodwillForm").addEventListener("submit", (e) => {
      e.preventDefault();
      postFile("/import/goodwill", e.target, document.getElementById("goodwillResult"), document.getElementById("goodwillStatus"));
    });

    document.getElementById("ebayForm").addEventListener("submit", (e) => {
      e.preventDefault();
      postFile("/import/ebay-sold", e.target, document.getElementById("ebayResult"), document.getElementById("ebayStatus"));
    });
  </script>
</div>
{% endblock %}
