{% extends "base.html" %}
{% block content %}

<div id="salesPage">
  <div class="page-header">
    <div>
      <h1>Sales</h1>
      <div class="small">Unmatched sales imported from eBay that need to be linked to an inventory item.</div>
    </div>

    <div class="page-actions">
      <button id="autoMatchBtn" type="button">Auto-match by SKU</button>
      <button id="refreshUnmatchedBtn" type="button">Refresh</button>
    </div>
  </div>

  <div class="card">
    <div class="section-header">
      <div>
        <h2>Unmatched Sales</h2>
        <div class="small">Count: <b id="unmatchedSalesCount">—</b></div>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Sold at</th>
            <th>Title</th>
            <th>Net</th>
            <th>SKU</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="unmatchedSalesBody">
          <tr><td colspan="5">Loading...</td></tr>
        </tbody>
      </table>
    </div>

    <pre id="salesResult" class="pre">{}</pre>
  </div>

  <!-- Match dialog -->
  <dialog id="matchSaleDialog">
    <div class="dialog-card">
      <div class="dialog-header">
        <div>
          <h3>Match sale to inventory item</h3>
          <div id="matchSaleMeta" class="small"></div>
        </div>
        <button id="matchSaleCloseBtn" type="button">Close</button>
      </div>

      <hr>

      <div class="row row-align-center">
        <div class="flex-1">
          <label class="label">Search inventory (SKU, title, location)</label>
          <input id="matchSearch" placeholder="type to filter..." />
        </div>

        <div class="row dialog-actions">
          <button id="matchConfirmBtn" type="button">Match</button>
        </div>
      </div>

      <div id="matchSaleMsg" class="small"></div>

      <div class="table-wrap mt-10">
        <table>
          <thead>
            <tr>
              <th></th>
              <th>Item</th>
              <th>Cost</th>
              <th>SKU</th>
              <th>Location</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="matchCandidatesBody">
            <tr><td colspan="6">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </dialog>

  <script>
    function esc(s) {
      return (s ?? "").toString()
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;");
    }

    let unmatchedSalesById = {};
    let candidateInventoryCache = null;

    async function loadUnmatchedSales() {
      const body = document.getElementById("unmatchedSalesBody");
      const countEl = document.getElementById("unmatchedSalesCount");

      body.innerHTML = `<tr><td colspan="5">Loading...</td></tr>`;
      countEl.textContent = "...";

      const res = await fetch("/api/sales/unmatched?limit=200", { cache: "no-store" });
      const data = await res.json();

      if (!res.ok || !data.ok) {
        body.innerHTML = `<tr><td colspan="5">Failed to load unmatched sales.</td></tr>`;
        countEl.textContent = "—";
        return;
      }

      const rows = data.items || [];
      unmatchedSalesById = {};
      for (const r of rows) unmatchedSalesById[r.id] = r;

      countEl.textContent = rows.length.toString();

      if (!rows.length) {
        body.innerHTML = `<tr><td colspan="5">No unmatched sales 🎉</td></tr>`;
        return;
      }

      body.innerHTML = rows.map(r => {
        const soldAt = esc(r.sold_at || "");
        const title = esc(r.title || "");
        const net = (r.net_payout ?? 0).toFixed(2);
        const sku = esc(r.sku || "");
        return `
          <tr>
            <td>${soldAt || "<span class='small'>—</span>"}</td>
            <td><b>${title}</b></td>
            <td>$${net}</td>
            <td>${sku || "<span class='small'>—</span>"}</td>
            <td><button type="button" onclick="openMatchSaleDialog(${r.id})">Match</button></td>
          </tr>
        `;
      }).join("");
    }

    async function loadCandidateInventoryIfNeeded() {
      if (candidateInventoryCache) return candidateInventoryCache;

      // Candidate pool: Unlisted items (safe/simple to start)
      const res = await fetch("/api/inventory/unlisted", { cache: "no-store" });
      const data = await res.json();
      candidateInventoryCache = (data.items || []).map(x => ({
        id: x.id,
        title: x.title || "",
        cost_total: x.cost_total ?? 0,
        sku: x.sku || "",
        location: x.location || "",
        status: x.status || "unlisted",
        acquired_date: x.acquired_date || ""
      }));

      return candidateInventoryCache;
    }

    let currentSaleToMatchId = null;
    let currentChosenInventoryId = null;

    function renderMatchCandidates(filterText) {
      const body = document.getElementById("matchCandidatesBody");
      if (!body) return;

      const q = (filterText || "").trim().toLowerCase();

      const rows = (candidateInventoryCache || []).filter(it => {
        if (!q) return true;
        return (
          (it.sku || "").toLowerCase().includes(q) ||
          (it.title || "").toLowerCase().includes(q) ||
          (it.location || "").toLowerCase().includes(q)
        );
      }).slice(0, 200);

      if (!rows.length) {
        body.innerHTML = `<tr><td colspan="6">No matches.</td></tr>`;
        return;
      }

      body.innerHTML = rows.map(it => {
        const checked = (it.id === currentChosenInventoryId) ? "checked" : "";
        const title = esc(it.title);
        const cost = (it.cost_total ?? 0).toFixed(2);
        const sku = esc(it.sku || "");
        const loc = esc(it.location || "");
        const status = esc(it.status || "");
        return `
          <tr>
            <td><input type="radio" name="matchPick" value="${it.id}" ${checked} onchange="pickInventoryForSale(${it.id})"></td>
            <td><b>${title}</b><div class="small">${esc(it.acquired_date || "")}</div></td>
            <td>$${cost}</td>
            <td>${sku || "<span class='small'>—</span>"}</td>
            <td>${loc || "<span class='small'>—</span>"}</td>
            <td>${status}</td>
          </tr>
        `;
      }).join("");
    }

    window.pickInventoryForSale = function (id) {
      currentChosenInventoryId = id;
      const msg = document.getElementById("matchSaleMsg");
      if (msg) msg.textContent = "";
    };

    window.openMatchSaleDialog = async function (saleId) {
      const sale = unmatchedSalesById[saleId];
      if (!sale) return;

      currentSaleToMatchId = saleId;
      currentChosenInventoryId = null;

      const metaEl = document.getElementById("matchSaleMeta");
      const msgEl = document.getElementById("matchSaleMsg");
      const searchEl = document.getElementById("matchSearch");
      const bodyEl = document.getElementById("matchCandidatesBody");

      if (msgEl) msgEl.textContent = "";
      if (searchEl) searchEl.value = "";
      if (bodyEl) bodyEl.innerHTML = `<tr><td colspan="6">Loading...</td></tr>`;

      const net = (sale.net_payout ?? 0).toFixed(2);
      metaEl.innerHTML = [
        `<b>Sale #:</b> ${sale.id}`,
        sale.sold_at ? `<b>Sold at:</b> ${esc(sale.sold_at)}` : "",
        sale.sku ? `<b>SKU:</b> ${esc(sale.sku)}` : "",
        `<b>Net payout:</b> $${net}`,
        `<b>Title:</b> ${esc(sale.title || "")}`,
      ].filter(Boolean).join("<br>");

      await loadCandidateInventoryIfNeeded();
      renderMatchCandidates(sale.sku || "");

      const dlg = document.getElementById("matchSaleDialog");
      dlg.showModal();
      setTimeout(() => document.getElementById("matchSearch")?.focus(), 0);
    };

    document.getElementById("matchSaleCloseBtn").addEventListener("click", () => {
      document.getElementById("matchSaleDialog").close();
    });

    document.getElementById("matchSearch").addEventListener("input", (e) => {
      renderMatchCandidates(e.target.value || "");
    });

    document.getElementById("matchConfirmBtn").addEventListener("click", async () => {
      const msgEl = document.getElementById("matchSaleMsg");
      if (!currentSaleToMatchId) return;

      if (!currentChosenInventoryId) {
        if (msgEl) msgEl.textContent = "❌ Pick an inventory item first.";
        return;
      }

      if (msgEl) msgEl.textContent = "Matching...";

      const res = await fetch("/api/sales/match", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sale_id: currentSaleToMatchId, inventory_item_id: currentChosenInventoryId })
      });

      const txt = await res.text();
      let parsed = null;
      try { parsed = JSON.parse(txt); } catch {}

      if (!res.ok || (parsed && parsed.ok === false)) {
        const err = (parsed && (parsed.detail || parsed.error)) ? (parsed.detail || parsed.error) : txt;
        if (msgEl) msgEl.textContent = "❌ " + err;
        return;
      }

      if (msgEl) msgEl.textContent = "✅ Matched.";
      delete unmatchedSalesById[currentSaleToMatchId];
      document.getElementById("matchSaleDialog").close();

      candidateInventoryCache = null;
      await loadUnmatchedSales();
    });

    document.getElementById("refreshUnmatchedBtn").addEventListener("click", () => {
      candidateInventoryCache = null;
      loadUnmatchedSales();
    });

    // NEW: Auto-match by SKU
    document.getElementById("autoMatchBtn").addEventListener("click", async () => {
      const out = document.getElementById("salesResult");
      out.textContent = "Running auto-match...";

      const res = await fetch("/api/sales/auto_match_sku", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ limit: 2000, mark_sold: true })
      });

      const txt = await res.text();
      try { out.textContent = JSON.stringify(JSON.parse(txt), null, 2); }
      catch { out.textContent = txt; }

      candidateInventoryCache = null;
      await loadUnmatchedSales();
    });

    (async () => {
      await loadUnmatchedSales();
    })();
  </script>
</div>

{% endblock %}
