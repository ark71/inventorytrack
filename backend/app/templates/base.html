<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}InventoryTrack{% endblock %}</title>

  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/theme.js"></script>

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/favicon-32x32.png" sizes="32x32">
  <link rel="icon" type="image/png" href="/favicon-16x16.png" sizes="16x16">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#0f172a">

</head>

<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-dot"></span>
        <span class="brand-name">InventoryTrack</span>
      </div>

      <nav class="nav">
        <a class="navlink {% if active_page=='home' %}active{% endif %}" href="/">Home</a>
        <a class="navlink {% if active_page=='imports' %}active{% endif %}" href="/imports">Imports</a>
        <a class="navlink {% if active_page=='inventory' %}active{% endif %}" href="/inventory">Inventory</a>
	<a class="navlink {% if active_page=='admin' %}active{% endif %}" href="/admin">Admin</a>
      </nav>

      <div class="topbar-right">
        <!-- placeholder for later: theme picker / search / user -->
        <span class="small">Local</span>
      </div>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
